<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#f4f4f0">
<script>try{if(localStorage.getItem("theme")==="dark")document.documentElement.dataset.theme="dark"}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<title>マイジャーナル</title>
<style>
:root{--bg:#f4f4f0;--card:#fcfcfa;--ink:#333536;--sub:#6b706c;--acc:#4a7c5c;--soft:#e4ede6;--line:#dcdcd5}
:root[data-theme="dark"]{--bg:#161a18;--card:#1f2421;--ink:#e4e7e4;--sub:#9aa39d;--acc:#7fb892;--soft:#263229;--line:#333a36;color-scheme:dark}
[data-theme="dark"] .card{box-shadow:none}
[data-theme="dark"] button.pri,[data-theme="dark"] .cd.sel,[data-theme="dark"] .cd.sel .n{color:#10201a}
[data-theme="dark"] button.danger{color:#e0958d;border-color:#7a4a45}
[data-theme="dark"] .cw.sun,[data-theme="dark"] .cd.sun .n{color:#d39088}
[data-theme="dark"] .cw.sat,[data-theme="dark"] .cd.sat .n{color:#8fb5a3}
[data-theme="dark"] .cd.sel .n{color:#10201a}
#fab{position:fixed;right:18px;bottom:calc(18px + env(safe-area-inset-bottom));width:56px;height:56px;padding:0;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:32px;line-height:1;box-shadow:0 3px 10px #0004;z-index:4}
[data-theme="dark"] #fab{color:#10201a}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px 16px 80px}
#top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:6px 16px;font-size:18px;font-weight:600;color:var(--acc)}
#top button{font-size:22px;padding:4px 12px;color:var(--ink)}
main{padding-top:14px}
#drawerBg{position:fixed;inset:0;background:#0007;z-index:20}
#drawer{position:fixed;top:0;right:0;bottom:0;width:78%;max-width:300px;background:var(--card);z-index:21;padding:16px 12px;overflow-y:auto;box-shadow:-4px 0 16px #0004;animation:slide .15s ease-out}
@keyframes slide{from{transform:translateX(100%)}to{transform:none}}
#drawer .mt{font-weight:600;color:var(--acc);padding:4px 8px 12px}
.mi{display:block;width:100%;text-align:left;border:0;border-bottom:1px solid var(--line);background:transparent;padding:14px 8px;font-size:16px;border-radius:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px;box-shadow:0 1px 2px #0000000a}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sub{color:var(--sub)}
#vVitals{margin-top:8px;font-size:16px}
input[type=text],input[type=number]{width:100%;font-size:14px;padding:9px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
input[type=date]{font-size:16px;padding:8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
button{font-size:15px;padding:9px 14px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.danger{color:#a8483f;border-color:#c9a29d}
.moods{display:flex;gap:10px}
.moods button{flex:1;font-size:32px;padding:10px 0}
.moods button.on{background:var(--soft);border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
textarea{width:100%;min-height:220px;font-size:16px;line-height:1.7;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.photos{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.photos:empty{display:none}
.ph{position:relative}
.ph img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.ph button{position:absolute;top:4px;right:4px;padding:2px 9px;font-size:16px;border-radius:50%;background:#000a;color:#fff;border:0}
#calGrid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.cw{text-align:center;font-size:12px;color:var(--sub);padding:2px 0}
.cw.sun,.cd.sun .n{color:#a0625a}
.cw.sat,.cd.sat .n{color:#5f8070}
.cd{aspect-ratio:1;padding:0;border:1px solid transparent;border-radius:10px;background:transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;line-height:1.1}
.cd .n{font-size:13px}
.cd .m{font-size:18px;min-height:20px}
.cd.has{background:var(--soft)}
.cd.today{border-color:var(--acc)}
.cd.sel{background:var(--acc);color:#fff}
.cd.sel .n{color:#fff}
.se .hd{display:flex;justify-content:space-between;gap:8px;font-weight:600;cursor:pointer}
.se .vt{margin-top:6px}
.se .tx{white-space:pre-wrap;line-height:1.9;margin-top:8px}
#vDate{font-size:18px;font-weight:600}
#vWeather{margin-top:4px;color:var(--sub);font-size:15px}
#vMood{font-size:40px;margin-top:10px}
#vText{white-space:pre-wrap;line-height:1.9;font-size:16px;margin-top:12px}
#vEmpty{color:var(--sub);padding:18px 0;text-align:center}
.item{padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.item:last-child{border:0}
.item small{color:var(--sub)}
#msg{position:fixed;left:0;right:0;bottom:16px;text-align:center;pointer-events:none}
#msg span{background:#000c;color:#fff;padding:8px 16px;border-radius:20px;font-size:14px;display:none}
#lb{position:fixed;inset:0;background:#000e;display:flex;align-items:center;justify-content:center;z-index:10}
#lb img{max-width:100%;max-height:100%}
</style>
</head>
<body>
<header id="top"><span>📔 マイジャーナル</span><button id="menuBtn" aria-label="メニュー">☰</button></header>
<main>

<!-- ========== 表示画面 ========== -->
<section id="viewScreen">
  <div class="card">
    <div class="row">
      <button id="prev">◀</button>
      <input type="date" id="date">
      <button id="next">▶</button>
      <button id="today">今日</button>
      <button id="yest">昨日</button>
    </div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between">
      <button id="cprev">◀</button>
      <b id="calTitle"></b>
      <button id="cnext">▶</button>
    </div>
    <div id="calGrid"></div>
  </div>

  <div class="card">
    <div id="vDate"></div>
    <div id="vEmpty">この日の日記はまだありません</div>
    <div id="vBody">
      <div id="vWeather"></div>
      <div id="vMood"></div>
      <div id="vVitals"></div>
      <div id="vText"></div>
      <div id="vPhotos" class="photos"></div>
    </div>
    <div class="row" style="margin-top:16px">
      <button class="pri" id="edit">✏️ 編集</button>
      <button class="danger" id="del">🗑 削除</button>
    </div>
  </div>

  <div class="card">
    <div class="sub" style="margin-bottom:8px">過去の日記</div>
    <div id="list"></div>
  </div>

</section>

<!-- ========== 設定画面 ========== -->
<section id="setScreen" hidden>
  <div class="card"><b>⚙️ 設定・データ</b></div>

  <div class="card">
    <div class="sub" style="margin-bottom:8px">☁️ Googleドライブ連携</div>
    <input type="text" id="cid" placeholder="クライアントID（…apps.googleusercontent.com）" autocomplete="off">
    <div class="row" style="margin-top:8px">
      <button id="gsave">IDを保存</button>
      <button class="pri" id="gsync">☁️ 今すぐ同期</button>
    </div>
    <div id="gstat" class="sub" style="font-size:13px;margin-top:8px"></div>
  </div>

  <div class="card">
    <div class="sub" style="margin-bottom:8px">データ（CSV）</div>
    <div class="row">
      <button id="exp">CSVを書き出す</button>
      <button id="imp">CSVを読み込む</button>
      <input type="file" id="cfile" accept=".csv,text/csv" hidden>
    </div>
    <div class="sub" style="font-size:13px;margin-top:8px">※写真は端末内に保存されます。Googleドライブ連携は次のステップで追加します。</div>
    <div id="pstat" class="sub" style="font-size:13px;margin-top:4px"></div>
  </div>
</section>

<!-- ========== まとめ画面 ========== -->
<section id="sumScreen" hidden>
  <div class="card">
    <div class="row">
      <button id="uweek">週</button>
      <button id="umonth">月</button>
    </div>
    <div class="row" style="justify-content:space-between;margin-top:10px">
      <button id="sprev">◀</button>
      <b id="sTitle"></b>
      <button id="snext">▶</button>
    </div>
    <div id="sStat" class="sub" style="font-size:13px;margin-top:8px"></div>
  </div>
  <div id="sList"></div>
</section>

<!-- ========== 編集画面 ========== -->
<section id="editScreen" hidden>
  <div class="card">
    <div class="row"><b id="eTitle">✏️ 日付</b><input type="date" id="eDate"></div>
    <div id="weather" class="sub" style="margin-top:6px"></div>
    <div class="row" style="margin-top:8px"><button id="wbtn">天気を取得し直す</button></div>
  </div>

  <div class="card">
    <div class="sub" style="margin-bottom:8px">今日の気分</div>
    <div class="moods">
      <button data-m="1">😞</button><button data-m="2">😐</button><button data-m="3">😊</button>
    </div>
  </div>

  <div class="card">
    <div class="sub" style="margin-bottom:8px">歩数・体重</div>
    <div class="row">
      <input type="number" id="steps" inputmode="numeric" placeholder="歩数" style="width:42%">
      <input type="number" id="weight" inputmode="decimal" step="0.1" placeholder="体重(kg)" style="width:42%">
    </div>
    <div class="row" style="margin-top:8px"><button id="hbtn">🩺 Googleヘルスから取得</button></div>
    <div id="hstat" class="sub" style="font-size:13px;margin-top:6px;white-space:pre-wrap;word-break:break-all"></div>
  </div>

  <div class="card">
    <textarea id="text" placeholder="今日はどんな一日でしたか？"></textarea>
    <div class="row" style="margin-top:10px">
      <button id="pbtn">📷 写真を追加（0/3）</button>
      <input type="file" id="pfile" accept="image/*" multiple hidden>
    </div>
    <div id="photos" class="photos"></div>
  </div>

  <div class="row">
    <button class="pri" id="done">✓ 完了</button>
  </div>
  <div class="sub" style="font-size:13px;margin-top:10px">入力内容は自動で保存されます。</div>
</section>
</main>

<button id="fab" aria-label="日記を追加">＋</button>
<div id="drawerBg" hidden></div>
<nav id="drawer" hidden>
  <div class="mt">メニュー</div>
  <button class="mi" id="mAdd">✏️ 今日の日記を書く</button>
  <button class="mi" id="mHome">🏠 週・月まとめ</button>
  <button class="mi" id="mCal">📅 カレンダー・日別</button>
  <button class="mi" id="mSync">☁️ 今すぐ同期</button>
  <button class="mi" id="mSet">⚙️ 設定・データ（CSV）</button>
  <button class="mi" id="mTheme">🌙 ダークモードに切り替え</button>
</nav>

<div id="lb" hidden><img id="lbimg" alt=""></div>
<div id="msg"><span></span></div>

<script>
const $=id=>document.getElementById(id);
const WCODE={0:"快晴",1:"晴れ",2:"晴れ時々くもり",3:"くもり",45:"霧",48:"霧",51:"小雨",53:"小雨",55:"雨",56:"着氷性の雨",57:"着氷性の雨",61:"雨",63:"雨",65:"強い雨",66:"凍雨",67:"凍雨",71:"小雪",73:"雪",75:"大雪",77:"雪",80:"にわか雨",81:"にわか雨",82:"激しいにわか雨",85:"にわか雪",86:"にわか雪",95:"雷雨",96:"雷雨",99:"雷雨"};
const WICON=c=>c<=1?"☀️":c<=3?"⛅":c<=48?"🌫️":c<=67?"🌧️":c<=77?"❄️":c<=82?"🌦️":c<=86?"🌨️":"⛈️";
const MOODS=["","😞","😐","😊"];

// ---- IndexedDB ----
let db;
const open=()=>new Promise((res,rej)=>{
  const r=indexedDB.open("journal",1);
  r.onupgradeneeded=()=>{r.result.createObjectStore("entries",{keyPath:"date"})};
  r.onsuccess=()=>{db=r.result;res()};
  r.onerror=()=>rej(r.error);
});
const tx=(mode,fn)=>new Promise((res,rej)=>{
  const t=db.transaction("entries",mode);const s=t.objectStore("entries");
  const r=fn(s);t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);
});
const getE=d=>tx("readonly",s=>s.get(d));
// 削除の記録（墓標）：ドライブ同期で「削除した日記」が復活しないようにする
const tombs=()=>JSON.parse(localStorage.getItem("tombs")||"{}");
const setTombs=t=>localStorage.setItem("tombs",JSON.stringify(t));
const putE=async e=>{
  await tx("readwrite",s=>s.put(e));
  const t=tombs();if(t[e.date]){delete t[e.date];setTombs(t)}
};
const delE=async d=>{
  const old=await getE(d);
  if(!old)return;
  await tx("readwrite",s=>s.delete(d));
  const t=tombs();t[d]=new Date().toISOString();setTombs(t);
};
const allE=()=>tx("readonly",s=>s.getAll());

// ---- state ----
const blank=date=>({date,mood:0,text:"",photos:[],wcode:null,wtext:"",tmax:null,tmin:null,steps:null,weight:null,updated:""});
let cur=blank(""), mode="view", tm, urls=[], lbUrl=null;
let entryMap={}, calYM=new Date(Date.now()+9*3600e3).toISOString().slice(0,7);
const ymd=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*60000);return z.toISOString().slice(0,10)};
const fmt=d=>new Date(d+"T00:00:00").toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"short"});
const isEmpty=e=>!(e.text||"").trim()&&!e.mood&&!e.photos.length&&e.steps==null&&e.weight==null;
const toast=m=>{const s=$("msg").firstElementChild;s.textContent=m;s.style.display="inline-block";setTimeout(()=>s.style.display="none",Math.min(7000,1800+m.length*80))};

// ---- lightbox ----
function openLb(b){lbUrl=URL.createObjectURL(b);$("lbimg").src=lbUrl;$("lb").hidden=false}
$("lb").onclick=()=>{$("lb").hidden=true;$("lbimg").removeAttribute("src");if(lbUrl)URL.revokeObjectURL(lbUrl);lbUrl=null};

// ---- カレンダー ----
function renderCal(){
  const [Y,M]=calYM.split("-").map(Number);
  $("calTitle").textContent=`${Y}年${M}月`;
  const first=new Date(Y,M-1,1).getDay(), days=new Date(Y,M,0).getDate();
  const today=ymd(new Date());
  const g=$("calGrid");g.innerHTML="";
  ["日","月","火","水","木","金","土"].forEach((w,i)=>{
    const h=document.createElement("div");h.className="cw"+(i===0?" sun":i===6?" sat":"");h.textContent=w;g.appendChild(h);
  });
  for(let i=0;i<first;i++)g.appendChild(document.createElement("div"));
  for(let d=1;d<=days;d++){
    const ds=`${Y}-${String(M).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const e=entryMap[ds], wd=(first+d-1)%7;
    const c=document.createElement("button");
    c.className="cd"+(wd===0?" sun":wd===6?" sat":"")+(e?" has":"")+(ds===cur.date?" sel":"")+(ds===today?" today":"");
    c.innerHTML='<span class="n"></span><span class="m"></span>';
    c.firstChild.textContent=d;
    c.lastChild.textContent=e?(MOODS[e.mood]||"•"):"";
    c.onclick=()=>{load(ds);scrollTo(0,0)};
    g.appendChild(c);
  }
}
const calShift=n=>{
  const [Y,M]=calYM.split("-").map(Number);
  const d=new Date(Y,M-1+n,1);
  calYM=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`;
  renderCal();
};

// ---- まとめ（週・月） ----
let sumUnit="week", sumRef="", sumTok=0;
const WD=["日","月","火","水","木","金","土"];
function sumRange(){
  const d=new Date(sumRef+"T00:00:00");
  if(sumUnit==="week"){
    const s=new Date(d);s.setDate(d.getDate()-d.getDay());
    const e=new Date(s);e.setDate(s.getDate()+6);
    return [ymd(s),ymd(e)];
  }
  return [ymd(new Date(d.getFullYear(),d.getMonth(),1)),ymd(new Date(d.getFullYear(),d.getMonth()+1,0))];
}
function sumShift(n){
  const d=new Date(sumRef+"T00:00:00");
  if(sumUnit==="week")d.setDate(d.getDate()+7*n);
  else d.setTime(new Date(d.getFullYear(),d.getMonth()+n,1).getTime());
  sumRef=ymd(d);
}
async function renderSum(){
  const tok=++sumTok;
  const [s,e]=sumRange();
  const sd=new Date(s+"T00:00:00"), ed=new Date(e+"T00:00:00");
  $("sTitle").textContent=sumUnit==="week"
    ?`${sd.getMonth()+1}/${sd.getDate()}(${WD[sd.getDay()]}) 〜 ${ed.getMonth()+1}/${ed.getDate()}(${WD[ed.getDay()]})`
    :`${sd.getFullYear()}年${sd.getMonth()+1}月`;
  $("uweek").classList.toggle("pri",sumUnit==="week");
  $("umonth").classList.toggle("pri",sumUnit==="month");
  const all=(await allE()).filter(x=>x.date>=s&&x.date<=e).sort((a,b)=>a.date.localeCompare(b.date));
  if(tok!==sumTok||mode!=="sum")return;
  // 集計
  const mc=[0,0,0,0];all.forEach(x=>mc[x.mood||0]++);
  const stp=all.filter(x=>x.steps!=null).map(x=>x.steps);
  const wts=all.filter(x=>x.weight!=null).map(x=>x.weight);
  const stat=[`日記 ${all.length}件`];
  if(mc[1]+mc[2]+mc[3])stat.push(`😊${mc[3]} 😐${mc[2]} 😞${mc[1]}`);
  if(stp.length)stat.push(`平均 ${Math.round(stp.reduce((a,b)=>a+b,0)/stp.length).toLocaleString()}歩`);
  if(wts.length)stat.push(`体重 ${wts[0]}→${wts[wts.length-1]}kg`);
  $("sStat").textContent=stat.join("　");
  // 一覧
  const box=$("sList");box.innerHTML="";
  if(!all.length){
    const d=document.createElement("div");d.className="card sub";d.style.textAlign="center";
    d.textContent="この期間の日記はありません";box.appendChild(d);return;
  }
  all.forEach(x=>{
    const c=document.createElement("div");c.className="card se";
    const dd=new Date(x.date+"T00:00:00");
    const hd=document.createElement("div");hd.className="hd";
    const l=document.createElement("span");l.textContent=`${dd.getMonth()+1}月${dd.getDate()}日(${WD[dd.getDay()]})`;
    const r=document.createElement("span");r.textContent=`${x.wcode==null?"":WICON(x.wcode)} ${MOODS[x.mood]||""}`;
    hd.append(l,r);hd.onclick=()=>{load(x.date);scrollTo(0,0)};
    c.appendChild(hd);
    const vit=[x.steps!=null?`👣 ${Number(x.steps).toLocaleString()}歩`:"",x.weight!=null?`⚖️ ${x.weight}kg`:""].filter(Boolean).join("　");
    if(vit){const v=document.createElement("div");v.className="vt sub";v.textContent=vit;c.appendChild(v)}
    if((x.text||"").trim()){const t=document.createElement("div");t.className="tx";t.textContent=x.text;c.appendChild(t)}
    const ph=x.photos||(x.photo?[x.photo]:[]);
    if(ph.length){
      const g=document.createElement("div");g.className="photos";
      ph.forEach(b=>{
        const w=document.createElement("div");w.className="ph";
        const u=URL.createObjectURL(b);urls.push(u);
        const im=document.createElement("img");im.src=u;im.onclick=()=>openLb(b);
        w.appendChild(im);g.appendChild(w);
      });
      c.appendChild(g);
    }
    box.appendChild(c);
  });
}

// ---- render ----
function photoGrid(box,editable){
  box.innerHTML="";
  cur.photos.forEach((b,i)=>{
    const d=document.createElement("div");d.className="ph";
    const u=URL.createObjectURL(b);urls.push(u);
    const im=document.createElement("img");im.src=u;im.onclick=()=>openLb(b);
    d.appendChild(im);
    if(editable){
      const x=document.createElement("button");x.textContent="×";
      x.onclick=e=>{e.stopPropagation();cur.photos.splice(i,1);render();save(true)};
      d.appendChild(x);
    }
    box.appendChild(d);
  });
}
function render(){
  urls.forEach(u=>URL.revokeObjectURL(u));urls=[];
  const edit=mode==="edit", sum=mode==="sum";
  $("viewScreen").hidden=mode!=="view";
  $("editScreen").hidden=!edit;
  $("sumScreen").hidden=!sum;
  $("setScreen").hidden=mode!=="set";
  $("menuBtn").hidden=edit;
  $("fab").hidden=edit;
  if(sum){renderSum();return}
  if(mode==="set")return;

  return new Promise((res,rej)=>{
    const saved=JSON.parse(localStorage.getItem("pos")||"null");
    if(!navigator.geolocation){saved?res(saved):res({lat:35.609,lon:139.730});return}
    navigator.geolocation.getCurrentPosition(
      p=>{const v={lat:p.coords.latitude,lon:p.coords.longitude};localStorage.setItem("pos",JSON.stringify(v));res(v)},
      ()=>saved?res(saved):res({lat:35.609,lon:139.730}), // 位置情報NGなら品川付近

const COLS=["date","mood","weather_code","weather_text","temp_max","temp_min","text","photo_file","updated_at","steps","weight_kg"];
const q=v=>{v=v==null?"":String(v);return /[",\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
function parseCSV(s){
  const rows=[];let r=[],f="",inq=false;
  for(let i=0;i<s.length;i++){
    const c=s[i];
    if(inq){if(c=='"'){if(s[i+1]=='"'){f+='"';i++}else inq=false}else f+=c}
    else if(c=='"')inq=true;
    else if(c==","){r.push(f);f=""}
    else if(c=="\n"){r.push(f);rows.push(r);r=[];f=""}
    else if(c!="\r")f+=c;
  }
  if(f||r.length){r.push(f);rows.push(r)}
  return rows;
}
async function exportCSV(){
  const a=(await allE()).sort((x,y)=>x.date.localeCompare(y.date));
  const lines=[COLS.join(",")];
  a.forEach(e=>lines.push([e.date,e.mood,e.wcode,e.wtext,e.tmax,e.tmin,e.text,(e.photos||(e.photo?[e.photo]:[])).map((_,i)=>`photo_${e.date}_${i+1}.jpg`).join(";"),e.updated,e.steps,e.weight].map(q).join(",")));
  const blob=new Blob(["﻿"+lines.join("\n")],{type:"text/csv"});
  const u=document.createElement("a");u.href=URL.createObjectURL(blob);u.download="journal.csv";u.click();
  toast("CSVを書き出しました");
}
async function importCSV(file){
  const rows=parseCSV((await file.text()).replace(/^﻿/,""));
  const h=rows.shift();let n=0;
  for(const r of rows){
    if(!r[0])continue;
    const o=Object.fromEntries(h.map((k,i)=>[k,r[i]]));
    if(o.deleted==="1")continue;
    const old=await getE(o.date);
    if(old&&old.updated&&o.updated_at&&old.updated>=o.updated_at)continue; // 新しい方を優先
    await putE({date:o.date,mood:+o.mood||0,text:o.text||"",photos:old?(old.photos||(old.photo?[old.photo]:[])):[],
      wcode:o.weather_code===""?null:+o.weather_code,wtext:o.weather_text||"",
      tmax:o.temp_max===""?null:+o.temp_max,tmin:o.temp_min===""?null:+o.temp_min,steps:o.steps?+o.steps:null,weight:o.weight_kg?+o.weight_kg:null,updated:o.updated_at||""});
    n++;
  }
  toast(`${n}件を読み込みました`);refreshList();load(cur.date);
}

// ---- Googleドライブ同期 ----
const SCOPE="https://www.googleapis.com/auth/drive.file";
const FOLDER_NAME="マイジャーナル", CSV_NAME="journal.csv";
const D="https://www.googleapis.com/drive/v3", U="https://www.googleapis.com/upload/drive/v3";
const gs={token:null,exp:0};
let syncing=false, gsiP=null;
const COLS_D=[...COLS,"deleted"];
const photoNames=e=>(e.photos||[]).map((_,i)=>`photo_${e.date}_${i+1}.jpg`);
const rowToEntry=o=>({date:o.date,mood:+o.mood||0,text:o.text||"",photos:[],
  wcode:o.weather_code?+o.weather_code:null,wtext:o.weather_text||"",
  tmax:o.temp_max?+o.temp_max:null,tmin:o.temp_min?+o.temp_min:null,
  steps:o.steps?+o.steps:null,weight:o.weight_kg?+o.weight_kg:null,updated:o.updated_at||""});
function buildCSV(entries,tm){
  const lines=[COLS_D.join(",")];
  Object.values(entries).sort((x,y)=>x.date.localeCompare(y.date)).forEach(e=>
    lines.push([e.date,e.mood,e.wcode,e.wtext,e.tmax,e.tmin,e.text,photoNames(e).join(";"),e.updated,e.steps,e.weight,""].map(q).join(",")));
  Object.keys(tm).sort().forEach(d=>lines.push([d,"","","","","","","",tm[d],"","","1"].map(q).join(",")));
  return lines.join("\n");
}
function loadGsi(){
  if(gsiP)return gsiP;
  gsiP=new Promise((res,rej)=>{
    if(window.google&&google.accounts&&google.accounts.oauth2)return res();
    const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";
    s.onload=res;
    s.onerror=()=>{gsiP=null;rej(new Error("Googleのログイン部品を読み込めません（オフラインかも）"))};
    document.head.appendChild(s);
  });
  return gsiP;
}
async function getToken(){
  if(gs.token&&Date.now()<gs.exp-60000)return gs.token;
  const cid=localStorage.getItem("gcid");
  if(!cid)throw new Error("クライアントIDを入力して「IDを保存」を押してください");
  await loadGsi();
  return new Promise((res,rej)=>{
    const c=google.accounts.oauth2.initTokenClient({
      client_id:cid,scope:SCOPE,include_granted_scopes:false,
      callback:r=>{
        if(r.error)return rej(new Error("ログインに失敗しました（"+r.error+"）"));
        gs.token=r.access_token;gs.exp=Date.now()+(+r.expires_in||3600)*1000;
        localStorage.setItem("gconn","1");res(gs.token);
      },
      error_callback:()=>rej(new Error("ログインが中断されました"))
    });
    c.requestAccessToken({prompt:localStorage.getItem("gconn")?"":"consent"});
  });
}
async function gapi(url,opts={}){
  const t=await getToken();
  const r=await fetch(url,{...opts,headers:{...(opts.headers||{}),Authorization:"Bearer "+t}});
  if(r.status===401){gs.token=null;throw new Error("ログインが切れました。もう一度「今すぐ同期」を押してください")}
  if(!r.ok)throw new Error("ドライブとの通信エラー（"+r.status+"）");
  return r;
}
async function ensureFolder(){
  let id=localStorage.getItem("gfolder");
  if(id){
    try{const j=await (await gapi(`${D}/files/${id}?fields=id,trashed`)).json();if(!j.trashed)return id}
    catch(e){if(/ログイン/.test(e.message))throw e}
  }
  const q1=encodeURIComponent(`mimeType='application/vnd.google-apps.folder' and name='${FOLDER_NAME}' and trashed=false`);
  const j=await (await gapi(`${D}/files?q=${q1}&fields=files(id)`)).json();
  if(j.files.length)id=j.files[0].id;
  else{
    const r=await gapi(`${D}/files?fields=id`,{method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({name:FOLDER_NAME,mimeType:"application/vnd.google-apps.folder"})});
    id=(await r.json()).id;
  }
  localStorage.setItem("gfolder",id);
  return id;
}
async function listFiles(fid){
  const m={};let tok="";
  do{
    const q1=encodeURIComponent(`'${fid}' in parents and trashed=false`);
    const j=await (await gapi(`${D}/files?q=${q1}&pageSize=1000&fields=nextPageToken,files(id,name)${tok?"&pageToken="+tok:""}`)).json();
    j.files.forEach(f=>{m[f.name]=f.id});
    tok=j.nextPageToken||"";
  }while(tok);
  return m;
}
async function uploadFile(fid,name,blob,mime,existingId){
  if(existingId){
    await gapi(`${U}/files/${existingId}?uploadType=media`,{method:"PATCH",headers:{"Content-Type":mime},body:blob});
    return existingId;
  }
  const f=new FormData();
  f.append("metadata",new Blob([JSON.stringify({name,parents:[fid]})],{type:"application/json"}));
  f.append("file",blob);
  const r=await gapi(`${U}/files?uploadType=multipart&fields=id`,{method:"POST",body:f});
  return (await r.json()).id;
}
const dl=async id=>(await gapi(`${D}/files/${id}?alt=media`)).blob();
async function uploadPhotos(fid,e,files){
  const names=photoNames(e);
  for(let i=0;i<names.length;i++){
    files[names[i]]=await uploadFile(fid,names[i],e.photos[i],"image/jpeg",files[names[i]]);
  }
  const pre=`photo_${e.date}_`;
  for(const n of Object.keys(files)){ // 枚数が減った分をドライブから消す
    if(n.startsWith(pre)&&!names.includes(n)){
      await gapi(`${D}/files/${files[n]}`,{method:"DELETE"});
      delete files[n];
    }
  }
}
function showLast(up,down){
  const iso=localStorage.getItem("glast");
  $("gstat").textContent=iso?`最終同期：${new Date(iso).toLocaleString("ja-JP")}`+(up||down?`（↑${up}件 ↓${down}件）`:""):"未同期";
}
async function syncDrive(silent){
  if(syncing||mode==="edit")return;
  syncing=true;
  if(!silent)toast("同期を開始しました");
  const say=m=>{$("gstat").textContent=m};
  try{
    say("同期中…ログイン");
    const fid=await ensureFolder();
    say("同期中…ドライブを確認");
    const files=await listFiles(fid);
    const remote={},rtomb={};
    if(files[CSV_NAME]){
      const txt=(await (await gapi(`${D}/files/${files[CSV_NAME]}?alt=media`)).text()).replace(/^﻿/,"");
      const rows=parseCSV(txt);const h=rows.shift()||[];
      rows.forEach(r=>{
        if(!r[0])return;
        const o=Object.fromEntries(h.map((k,i)=>[k,r[i]]));
        if(o.deleted==="1")rtomb[o.date]=o.updated_at||"";
        else remote[o.date]={e:rowToEntry(o),n:(o.photo_file||"").split(";").filter(Boolean).length};
      });
    }
    const local={};
    (await allE()).forEach(e=>{if(!e.photos)e.photos=e.photo?[e.photo]:[];delete e.photo;local[e.date]=e});
    const lt=tombs();
    const finalE={},finalT={};
    let up=0,down=0,dirty=false;
    const dates=[...new Set([...Object.keys(local),...Object.keys(remote),...Object.keys(lt),...Object.keys(rtomb)])];
    for(let i=0;i<dates.length;i++){
      const d=dates[i];
      const L=local[d]?{e:local[d],t:local[d].updated||""}:(lt[d]!=null?{t:lt[d]}:null);
      const R=remote[d]?{e:remote[d].e,n:remote[d].n,t:remote[d].e.updated}:(rtomb[d]!=null?{t:rtomb[d]}:null);
      if(L&&(!R||L.t>=R.t)){            // ローカルが新しい（または同じ）
        if(L.e){
          finalE[d]=L.e;
          if(!R||!R.e||L.t>R.t){
            say(`同期中…アップロード ${i+1}/${dates.length}`);
            await uploadPhotos(fid,L.e,files);up++;dirty=true;
          }
        }else{
          finalT[d]=L.t;
          if(!R||R.e||L.t>R.t){await uploadPhotos(fid,{date:d,photos:[]},files);dirty=true}
        }
      }else if(R.e){                    // ドライブ側が新しい
        say(`同期中…ダウンロード ${i+1}/${dates.length}`);
        const e=R.e;
        for(let k=1;k<=R.n;k++){
          const id=files[`photo_${d}_${k}.jpg`];
          if(id)e.photos.push(await dl(id));
        }
        await tx("readwrite",s=>s.put(e));
        finalE[d]=e;down++;
      }else{                            // ドライブ側で削除されている
        if(L&&L.e){await tx("readwrite",s=>s.delete(d));down++}
        finalT[d]=R.t;
      }
    }
    if(dirty){
      say("同期中…CSVを保存");
      const csv=new Blob(["﻿"+buildCSV(finalE,finalT)],{type:"text/csv"});
      files[CSV_NAME]=await uploadFile(fid,CSV_NAME,csv,"text/csv",files[CSV_NAME]);
    }
    setTombs(finalT);
    localStorage.setItem("glast",new Date().toISOString());
    showLast(up,down);
    refreshList();
    if(mode==="view")await load(cur.date);
    else if(mode==="sum")render();
    if(!silent)toast("同期しました");
  }catch(e){
    say("同期エラー："+e.message);
    if(!silent)toast("同期できませんでした："+e.message);
  }finally{syncing=false}
}
const autoSync=()=>{if(gs.token&&Date.now()<gs.exp-60000)syncDrive(true)};

const HSCOPE="https://www.googleapis.com/auth/googlehealth.activity_and_fitness.readonly https://www.googleapis.com/auth/googlehealth.health_metrics_and_measurements.readonly";
const gh={token:null,exp:0};
async function getHealthToken(){

        gh.token=r.access_token;gh.exp=Date.now()+(+r.expires_in||3600)*1000;
        localStorage.setItem("hconn","1");res(gh.token);
      },
      error_callback:()=>rej(new Error("ログインが中断されました"))
    });

function pickWeightKg(j){
  const p=j&&j.rollupDataPoints&&j.rollupDataPoints[0];
  const w=p&&p.weight;
  if(!w)return null;
  const keys=Object.keys(w).filter(k=>/gram/i.test(k)&&w[k]!==""&&!isNaN(+w[k]));
  const k=keys.find(k=>/avg|last|max/i.test(k))||keys[0];
  return k?Math.round(+w[k]/100)/10:null; // g → kg（小数1桁）
}
async function fetchHealth(){
  const st=$("hstat"),d=cur.date,t0=cur;
  st.textContent="取得中…";
  try{
    const token=await getHealthToken();
    const [Y,M,Dd]=d.split("-").map(Number);
    const civil=(h,mi,s)=>({date:{year:Y,month:M,day:Dd},time:{hours:h,minutes:mi,seconds:s,nanos:0}});
    const body=JSON.stringify({range:{start:civil(0,0,0),end:civil(23,59,59)},windowSizeDays:1});
    const call=async type=>{
      const r=await fetch(`https://health.googleapis.com/v4/users/me/dataTypes/${type}/dataPoints:dailyRollUp`,
        {method:"POST",headers:{Authorization:"Bearer "+token,"Content-Type":"application/json"},body});
      const txt=await r.text();
      if(!r.ok)throw new Error(`${r.status} ${txt.slice(0,300)}`);
      return JSON.parse(txt);
    };
    const [rs,rw]=await Promise.allSettled([call("steps"),call("weight")]);
    if(cur!==t0)return;
    const msgs=[];
    if(rs.status==="fulfilled"){
      const c=rs.value.rollupDataPoints&&rs.value.rollupDataPoints[0]&&rs.value.rollupDataPoints[0].steps;
      if(c&&c.countSum!=null&&!isNaN(+c.countSum)){$("steps").value=Math.round(+c.countSum);msgs.push(`歩数 ${Math.round(+c.countSum)}`)}
      else msgs.push("歩数：この日のデータなし\n"+JSON.stringify(rs.value).slice(0,200));
    }else msgs.push("歩数：取得できませんでした\n"+rs.reason.message);
    if(rw.status==="fulfilled"){
      const kg=pickWeightKg(rw.value);
      if(kg!=null){$("weight").value=kg;msgs.push(`体重 ${kg}kg`)}
      else msgs.push("体重：この日のデータなし（または形式が想定外）\n"+JSON.stringify(rw.value).slice(0,300));
    }else msgs.push("体重：取得できませんでした\n"+rw.reason.message);
    st.textContent=msgs.join("\n");
    await save(true);
  }catch(e){st.textContent="取得エラー："+e.message}
}

function applyTheme(t,save){
  document.documentElement.dataset.theme=t;
  const m=document.querySelector('meta[name="theme-color"]');
  if(m)m.content=t==="dark"?"#161a18":"#f4f4f0";
  $("mTheme").textContent=t==="dark"?"☀️ ライトモードに切り替え":"🌙 ダークモードに切り替え";
  if(save){try{localStorage.setItem("theme",t)}catch(e){}}
}
$("mTheme").onclick=()=>applyTheme(document.documentElement.dataset.theme==="dark"?"light":"dark",true);
applyTheme(document.documentElement.dataset.theme==="dark"?"dark":"light",false);
$("uweek").onclick=()=>{sumUnit="week";render()};
$("umonth").onclick=()=>{sumUnit="month";render()};
$("sprev").onclick=()=>{sumShift(-1);render()};
$("snext").onclick=()=>{sumShift(1);render()};
$("cprev").onclick=()=>calShift(-1);
$("cnext").onclick=()=>calShift(1);
$("date").onchange=e=>{if(e.target.value)load(e.target.value)};
$("prev").onclick=()=>load(shift(-1));
$("next").onclick=()=>load(shift(1));
$("today").onclick=()=>load(ymd(new Date()));
$("yest").onclick=()=>load(ymd(new Date(Date.now()-864e5)));
$("edit").onclick=()=>{if(syncing)return toast("同期中です。少しお待ちください");mode="edit";$("text").value=cur.text||"";$("steps").value=cur.steps==null?"":cur.steps;$("weight").value=cur.weight==null?"":cur.weight;$("hstat").textContent="";render();scrollTo(0,0)};
$("del").onclick=async()=>{
  if(!confirm(`${cur.date} の日記を削除しますか？\n（写真も一緒に消え、元に戻せません）`))return;
  await delE(cur.date);
  cur=blank(cur.date);
  render();refreshList();toast("削除しました");
  fetchWeather(true);
  autoSync();
};
$("exp").onclick=exportCSV;
$("imp").onclick=()=>$("cfile").click();
$("cfile").onchange=e=>{if(e.target.files[0])importCSV(e.target.files[0]);e.target.value=""};

// ---- events: 編集画面 ----
document.querySelectorAll(".moods button").forEach(b=>b.onclick=()=>{
  const m=+b.dataset.m;cur.mood=cur.mood===m?0:m;render();save(true);
});
$("wbtn").onclick=()=>fetchWeather();
$("eDate").onchange=async e=>{
  const nd=e.target.value, od=cur.date;
  if(!nd||nd===od){e.target.value=od;return}
  clearTimeout(tm);
  cur.text=$("text").value;
  cur.steps=$("steps").value===""?null:Math.round(+$("steps").value);
  cur.weight=$("weight").value===""?null:+$("weight").value;
  const target=await getE(nd);
  if(isEmpty(cur)){                       // まだ何も書いていない → その日の日記へ切り替え
    await save(true);
    await load(nd);
    $("edit").click();
  }else if(!target){                      // 書きかけ → 日付を付け替える（移動）
    await delE(od);
    cur.date=nd;cur.wcode=null;cur.wtext="";cur.tmax=null;cur.tmin=null;
    await save(true);
    render();
    fetchWeather(true);
    toast("日付を変更しました");
  }else{                                  // 移動先にすでに日記がある
    e.target.value=od;
    toast("その日にはすでに日記があります");
  }
};
$("text").oninput=()=>{clearTimeout(tm);tm=setTimeout(()=>save(true),1500)};
$("pbtn").onclick=()=>{if(cur.photos.length>=3)return toast("写真は1日3枚までです");$("pfile").click()};
$("pfile").onchange=async e=>{
  const fs=[...e.target.files];e.target.value="";
  const room=3-cur.photos.length;
  if(fs.length>room)toast("写真は1日3枚までです");
  for(const f of fs.slice(0,room))cur.photos.push(await resize(f));
  render();save(true);
};
$("done").onclick=async()=>{
  clearTimeout(tm);
  await save(true);
  mode="view";render();scrollTo(0,0);toast("保存しました");
  autoSync();
};

// ---- 永続ストレージ（ブラウザによる自動削除を防ぐ） ----
async function protectStorage(){
  const el=$("pstat");
  if(!(navigator.storage&&navigator.storage.persist)){el.textContent="データ保護：この環境では非対応";return}
  try{
    let ok=await navigator.storage.persisted();
    if(!ok)ok=await navigator.storage.persist();
    el.textContent=ok?"🔒 データ保護：有効（ブラウザに自動削除されません）":"データ保護：未許可（ホーム画面に追加して使うと許可されやすくなります）";
  }catch(e){el.textContent="データ保護：確認できませんでした"}
}

(async()=>{
  await open();
  protectStorage();
  initDriveUI();
  await load(ymd(new Date()));
  refreshList();
  goHome();
  if("serviceWorker" in navigator)navigator.serviceWorker.register("sw.js");
})();
</script>
